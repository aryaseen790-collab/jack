<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Order</title>
<meta name="description" content="Add Jack in the Box menu items and estimate your total before you order.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>try{var t=localStorage.getItem("jitb-guide-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body data-page="order">
<header id="site-header"></header>
<main class="wrap">

<div class="page-head"><span class="eyebrow" aria-hidden="true">🧾</span><h1>My order</h1><p>Add items from any menu page to estimate what you'll spend. This is only a calculator: it doesn't place an order. Your list is saved in this browser.</p></div>
<div class="order-layout">
  <div class="panel"><div id="order-list"></div></div>
  <aside class="panel">
    <label class="tax" for="tax">Sales tax %<input id="tax" type="number" min="0" max="15" step="0.25" value="8.25"></label>
    <div class="totals">
      <div><span>Subtotal</span><span id="o-sub">$0.00</span></div>
      <div><span>Estimated tax</span><span id="o-tax">$0.00</span></div>
      <div class="grand"><span>Total</span><span id="o-total">$0.00</span></div>
    </div>
    <p style="color:var(--muted);font-size:.88rem">Uses typical prices. Your restaurant's prices may be higher or lower.</p>
    <button class="btn ghost" type="button" id="clear-order">Clear order</button>
  </aside>
</div>

</main>
<footer id="site-footer"></footer>
<script src="assets/menu-data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
