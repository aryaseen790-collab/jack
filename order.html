<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Receipt</title>
<meta name="description" content="Add Jack in the Box menu items and estimate your total before you order.">
<meta name="theme-color" content="#161b33">
<meta property="og:title" content="My Receipt">
<meta property="og:description" content="Add Jack in the Box menu items and estimate your total before you order.">
<meta property="og:image" content="docs/preview.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='4' y='11' width='24' height='18' rx='2' fill='%23d9301f' stroke='%23f7bd1d' stroke-width='2'/><rect x='3' y='5' width='26' height='5' rx='1.5' fill='%23d9301f' stroke='%23f7bd1d' stroke-width='2' transform='rotate(-14 3 10)'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@500;600&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>try{var t=localStorage.getItem("jitb-guide-theme");if(t)document.documentElement.setAttribute("data-theme",JSON.parse(t))}catch(e){}function isSlotImg(i){return i&&i.tagName==="IMG"&&i.parentNode&&i.parentNode.classList&&i.parentNode.classList.contains("slot")}document.addEventListener("load",function(e){if(isSlotImg(e.target))e.target.parentNode.classList.add("loaded")},true);document.addEventListener("error",function(e){var i=e.target;if(!isSlotImg(i))return;var a=i.getAttribute("data-alt");if(a){i.removeAttribute("data-alt");i.src=a;return}i.parentNode.classList.add("empty");i.remove()},true);</script>
</head>
<body data-page="order">
<header id="site-header"></header>
<main>

<div class="wrap page-head"><p class="eyebrow">Price estimator</p><h1>My receipt</h1><p class="lead">Everything you've added, with an estimated total. This is a calculator only: it doesn't place an order. Your receipt is saved in this browser.</p></div>
<div class="wrap order-layout">
  <div><div class="receipt" id="order-receipt" data-receipt></div><div class="receipt-actions"><button class="btn ghost sm" type="button" data-tear>Tear off and start over</button></div></div>
  <div class="order-side">
    <label class="tax-field" for="tax">Sales tax %<input id="tax" type="number" min="0" max="20" step="0.25" inputmode="decimal"></label>
    <section class="board"><h2 class="board-title">Add a side<small>Cheapest first</small></h2><ul class="rows" id="addon-rows"></ul></section>
  </div>
</div>

</main>
<footer id="site-footer"></footer>
<script src="assets/menu-data.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
